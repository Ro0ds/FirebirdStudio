name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows x64 packages
    runs-on: windows-latest

    steps:
      - name: Require the main branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Select the main branch to publish a stable release. Selected ref: $env:GITHUB_REF"
          }

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version and tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Path "VERSION" -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
              throw "VERSION must contain a valid SemVer version without a leading 'v'. Found: '$version'"
          }

          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check whether tag '$tag' already exists."
          }
          if ($existingTag) {
              throw "Tag '$tag' already exists. Update VERSION before publishing another release."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and package Windows release
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FirebirdStudio v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            releases/FirebirdStudio-${{ steps.version.outputs.version }}-win-x64-*.zip
            releases/checksums.txt
            releases/release-manifest.json
