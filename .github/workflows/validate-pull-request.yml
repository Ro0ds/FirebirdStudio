name: Pull request validation

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore dependencies
        run: dotnet restore FirebirdStudio.sln

      - name: Build solution
        run: dotnet build FirebirdStudio.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test FirebirdStudio.sln -c Release --no-build --no-restore

      - name: Verify repository structure
        run: python scripts/verify-structure.py
